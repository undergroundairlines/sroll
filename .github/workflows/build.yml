name: Build Scroll Guard APK

on:
  workflow_dispatch:
  push:
    branches: [main, scroll-guard]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Keep one signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scroll-guard-debug-signing-v1

      - name: Pin the signing key before emulator setup
        run: |
          mkdir -p "$HOME/.android" "$RUNNER_TEMP/scroll-guard-signing"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          cp "$HOME/.android/debug.keystore" "$RUNNER_TEMP/scroll-guard-signing/debug.keystore"
          echo "SCROLL_GUARD_SIGNING_STORE=$RUNNER_TEMP/scroll-guard-signing/debug.keystore" >> "$GITHUB_ENV"
          keytool -exportcert -keystore "$RUNNER_TEMP/scroll-guard-signing/debug.keystore" -storepass android -alias androiddebugkey | sha256sum

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Test, lint, and build debug APK
        run: gradle test lint assembleDebug --stacktrace

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify real accessibility enforcement on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: gradle :guard-test-fixture:installDebug :app:connectedDebugAndroidTest --stacktrace; guard_test_result=$?; adb pull /sdcard/Download/scrollguard-verification app/build/reports/device; exit "$guard_test_result"

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scroll-guard-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Preserve the same key in the signing cache
        if: always()
        run: |
          if [ -f "$SCROLL_GUARD_SIGNING_STORE" ]; then
            mkdir -p "$HOME/.android"
            cp "$SCROLL_GUARD_SIGNING_STORE" "$HOME/.android/debug.keystore"
          fi

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: scroll-guard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
