name: Build Scroll Guard APK

on:
  workflow_dispatch:
  push:
    branches: [main, scroll-guard]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Keep one signing key for future updates
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: scroll-guard-debug-signing-v1

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Test, lint, and build debug APK
        run: gradle test lint assembleDebug --stacktrace

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify real accessibility enforcement on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: gradle :guard-test-fixture:installDebug :app:connectedDebugAndroidTest --stacktrace && adb pull /sdcard/Android/data/app.scrollguard/files/feed-lock.png app/build/reports/feed-lock.png

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scroll-guard-verification
          path: |
            app/build/reports/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: scroll-guard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
