name: Build Scroll Guard Fresh APK

on:
  workflow_dispatch:

concurrency:
  group: scroll-guard-fresh-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Pin fresh signing key and encrypt its recovery backup
        id: signing
        env:
          GH_TOKEN: ${{ github.token }}
          SCROLL_GUARD_FRESH_SIGNING_KEY_BASE64: ${{ secrets.SCROLL_GUARD_FRESH_SIGNING_KEY_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/scroll-guard-signing" "$RUNNER_TEMP/scroll-guard-fresh-backup"
          pinned_store="$RUNNER_TEMP/scroll-guard-signing/fresh.p12"
          if [ -n "$SCROLL_GUARD_FRESH_SIGNING_KEY_BASE64" ]; then
            printf '%s' "$SCROLL_GUARD_FRESH_SIGNING_KEY_BASE64" | base64 --decode > "$pinned_store"
          else
            # One explicitly authorised first installation. Never silently replace its key.
            if [ -f scripts/signing/fresh-certificate.sha256 ] || gh release view v0.4.6-fresh --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              echo "::error::Restore the saved Fresh key using SCROLL_GUARD_FRESH_SIGNING_KEY_BASE64. Refusing to generate a replacement key."
              exit 1
            fi
            keytool -genkeypair -keystore "$pinned_store" -storetype PKCS12 -storepass android -keypass android -alias androiddebugkey -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=Scroll Guard Fresh,O=Scroll Guard,C=NZ"
          fi
          certificate=$(keytool -exportcert -keystore "$pinned_store" -storepass android -alias androiddebugkey | sha256sum | cut -d ' ' -f 1)
          if [ -f scripts/signing/fresh-certificate.sha256 ] && [ "$certificate" != "$(tr -d '[:space:]' < scripts/signing/fresh-certificate.sha256)" ]; then
            echo "::error::Fresh signing key differs from the pinned installed-app certificate."
            exit 1
          fi
          echo "SCROLL_GUARD_SIGNING_STORE=$pinned_store" >> "$GITHUB_ENV"
          echo "SCROLL_GUARD_EXPECTED_CERTIFICATE=$certificate" >> "$GITHUB_ENV"
          printf '%s\n' "$certificate" > "$RUNNER_TEMP/scroll-guard-fresh-backup/certificate.sha256"
          keytool -exportcert -keystore "$pinned_store" -storepass android -alias androiddebugkey -file "$RUNNER_TEMP/scroll-guard-fresh-backup/app-signing-certificate.der"
          # Only the public recovery certificate is in Git. Its private key is backed up
          # privately outside this repository. The runner never uploads a plaintext key.
          openssl cms -encrypt -binary -aes-256-cbc -in "$pinned_store" -out "$RUNNER_TEMP/scroll-guard-fresh-backup/signing-key.p12.cms" -outform DER scripts/signing/fresh-recovery-public.pem
          cp scripts/signing/fresh-recovery-public.pem "$RUNNER_TEMP/scroll-guard-fresh-backup/recovery-public.pem"
          echo "Fresh public signing certificate SHA-256: $certificate"

      - name: Preserve encrypted signing backup before building
        uses: actions/upload-artifact@v4
        with:
          name: scroll-guard-fresh-encrypted-signing-backup
          path: ${{ runner.temp }}/scroll-guard-fresh-backup/
          if-no-files-found: error
          retention-days: 90

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.7.1"

      - name: Test, lint, and build debug APK
        id: build-apk
        run: gradle test lint assembleDebug --stacktrace

      - name: Record unit test totals
        if: always()
        run: |
          mkdir -p app/build/reports/delivery
          python3 - <<'PY' | tee app/build/reports/delivery/unit-tests.txt
          import glob, xml.etree.ElementTree as ET
          totals = dict(tests=0, failures=0, errors=0, skipped=0)
          for path in glob.glob('app/build/test-results/testDebugUnitTest/TEST-*.xml'):
              root = ET.parse(path).getroot()
              for key in totals:
                  totals[key] += int(root.get(key, 0))
          print('Unit tests:', ', '.join(f'{key}={value}' for key,value in totals.items()))
          assert totals['tests'] > totals['skipped'], 'No unit tests actually ran'
          assert totals['failures'] == totals['errors'] == 0, 'Unit tests failed'
          PY

      - name: Verify APK identity after build
        if: steps.signing.outcome == 'success'
        run: bash scripts/verify-delivery-apk.sh app/build/outputs/apk/debug/app-debug.apk after-build

      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm

      - name: Verify Android accessibility mechanics with a synthetic fixture
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: gradle :guard-test-fixture:installDebug :app:connectedDebugAndroidTest --stacktrace; guard_test_result=$?; adb pull /sdcard/Download/scrollguard-verification app/build/reports/device; exit "$guard_test_result"

      - name: Record Android test totals
        if: always() && steps.build-apk.outcome == 'success'
        run: |
          python3 - <<'PY' | tee app/build/reports/delivery/android-tests.txt
          import glob, xml.etree.ElementTree as ET
          cases = []
          for path in glob.glob('app/build/outputs/androidTest-results/connected/**/*.xml', recursive=True):
              cases.extend(ET.parse(path).getroot().iter('testcase'))
          totals = dict(tests=len(cases), failures=sum(c.find('failure') is not None for c in cases),
              errors=sum(c.find('error') is not None for c in cases),
              skipped=sum(c.find('skipped') is not None for c in cases))
          print('Android 15 synthetic tests:', ', '.join(f'{key}={value}' for key,value in totals.items()))
          assert totals['tests'] > totals['skipped'], 'No Android instrumentation tests actually ran'
          assert totals['failures'] == totals['errors'] == 0, 'Android instrumentation failed'
          PY

      - name: Verify APK identity after instrumentation
        if: always() && steps.build-apk.outcome == 'success' && steps.signing.outcome == 'success'
        run: bash scripts/verify-delivery-apk.sh app/build/outputs/apk/debug/app-debug.apk after-instrumentation

      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scroll-guard-verification
          path: |
            app/build/reports/
            app/build/test-results/
            app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Confirm the final deliverable identity
        run: |
          if [ '${{ steps.signing.outcome }}' != 'success' ]; then
            echo "::error::Fresh signing failed; no APK may be delivered. Restore the saved Fresh key rather than replacing it."
            exit 1
          fi
          bash scripts/verify-delivery-apk.sh app/build/outputs/apk/debug/app-debug.apk final-delivery
          cat app/build/reports/delivery/final-delivery.txt >> "$GITHUB_STEP_SUMMARY"
          echo "Android instrumentation uses a synthetic Instagram fixture. It verifies Android mechanics, not compatibility with the user's real Instagram build." >> "$GITHUB_STEP_SUMMARY"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: scroll-guard-fresh-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/delivery/final-delivery.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish verified fresh-install phone download
        if: github.ref == 'refs/heads/codex/fresh-install-046'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bash scripts/verify-delivery-apk.sh app/build/outputs/apk/debug/app-debug.apk final-release
          tag="v0.4.6-fresh"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::This Fresh release already exists. Increment the version; never replace an installed release with a new key."
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/scroll-guard-delivery"
          apk="$RUNNER_TEMP/scroll-guard-delivery/scroll-guard-fresh-0.4.6.apk"
          report="$RUNNER_TEMP/scroll-guard-delivery/scroll-guard-fresh-0.4.6-verification.txt"
          archive="$RUNNER_TEMP/scroll-guard-delivery/Scroll-Guard-Fresh-0.4.6.zip"
          cp app/build/outputs/apk/debug/app-debug.apk "$apk"
          cp app/build/reports/delivery/final-release.txt "$report"
          cmp app/build/outputs/apk/debug/app-debug.apk "$apk"
          zip -j "$archive" "$apk" "$report"
          unzip -p "$archive" scroll-guard-fresh-0.4.6.apk | cmp - "$apk"
          notes="$RUNNER_TEMP/scroll-guard-delivery/release-notes.md"
          cat > "$notes" <<'EOF'
          Scroll Guard Fresh 0.4.6, versionCode 406, package app.scrollguard.fresh.

          This is the newest enforcement implementation as a separately installed app, explicitly authorised after loss of the legacy signing key. It leaves the old Scroll Guard app and its data in place; history/settings are not migrated.

          Download scroll-guard-fresh-0.4.6.apk, or extract Scroll-Guard-Fresh-0.4.6.zip and open its APK. Turn OFF the old Scroll Guard accessibility service and turn ON Scroll Guard Fresh. If Android requires it, allow restricted settings from App info first. Complete the disclosure/setup. Enable Instagram and Protect Home from Reels for selective Home-media protection with messages, photo sending, profiles and Stories. Turning that option OFF uses the stronger entire-Home lock, including ordinary posts. Whole-Instagram blocking is a separate strongest fallback. Strict Mode retains its persistent 30-minute delay within this new installation.

          Fixes include guarded-feed continuity through unknown/empty interface trees and notification-shade suspension, positive photo evidence before releasing an active Home guard, hidden-page rejection and shared ownership for profile markers. No-op navigation/scroll requests never prove a safe destination. No screen-time redesign or unrelated app support was added.

          Verification: unit tests, lint, APK compilation and the full Android 15 synthetic accessibility/overlay instrumentation suite must pass before publication. Instrumentation checks native touch/scroll counters, messaging/photo sending, Stories, lifecycle recovery and Strict Mode. These are Android mechanics tests, not proof of compatibility with the phone's real Instagram/Nothing OS version. Selective Home-media detection remains best effort; custom inaccessible players can evade initial recognition and unlabelled Home photos/videos may be conservatively guarded.

          Phone check: open Home video/Reels and repeatedly swipe/tap; the protected feed must not move. Open messages and send text/photo, advance Stories, then return to a Home video and confirm relocking. Open the notification shade/launcher and confirm no Instagram shield covers them.

          The verification text contains the exact delivered APK checksum, package, version, signing certificate and actual test totals. The CMS file is an encrypted private-key recovery backup, not an app to install; its decryption key stays private outside the repository. No plaintext signing material or synthetic Instagram fixture is included in the APK or install ZIP.
          EOF
          gh release create "$tag" "$apk" "$archive" "$report" "$RUNNER_TEMP/scroll-guard-fresh-backup/signing-key.p12.cms" "$RUNNER_TEMP/scroll-guard-fresh-backup/app-signing-certificate.der" --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease --title "Scroll Guard Fresh 0.4.6" --notes-file "$notes"
          echo "Phone download: https://github.com/$GITHUB_REPOSITORY/releases/download/$tag/scroll-guard-fresh-0.4.6.apk" >> "$GITHUB_STEP_SUMMARY"
